<title>Espace Nakhlé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap">
<style>
/* Concept: a calm sales document on screen. Architectural white ground, charcoal bands, olive as the one accent. Residences are the product; the filter and the modal do the work. */
:root{
  --bg:#F4F4F2; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#5E5F5A; --line:#D7D7D2; --accent:#6B6F5A; --accent-ink:#FFFFFF;
  --band:#1A1A1A; --band-ink:#F4F4F2; --band-muted:#B9B9B4; --chip:#E9E9E5; --t1:#B0B0B0; --t2:#6B6F5A; --t3:#1A1A1A;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --f-ar:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px)); --gutr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413; --surface:#1E1E1D; --ink:#EFEFEB; --muted:#A8A8A2; --line:#34342F; --accent:#A3A98C; --accent-ink:#141413;
  --band:#0C0C0B; --band-ink:#F1F1ED; --band-muted:#A8A8A2; --chip:#262624; --t1:#7C7C78; --t2:#A3A98C; --t3:#EFEFEB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141413; --surface:#1E1E1D; --ink:#EFEFEB; --muted:#A8A8A2; --line:#34342F; --accent:#A3A98C; --accent-ink:#141413;
  --band:#0C0C0B; --band-ink:#F1F1ED; --band-muted:#A8A8A2; --chip:#262624; --t1:#7C7C78; --t2:#A3A98C; --t3:#EFEFEB; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:400;font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
html[dir=rtl] body{font-family:var(--f-ar)}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--accent)}
html[dir=rtl] .eyebrow{letter-spacing:0;font-size:.85rem}
h1,h2,h3,h4{font-weight:300;margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:clamp(1.8rem,4vw,2.7rem);margin-top:.5rem}
.lead{max-width:62ch;color:var(--muted);font-size:1.05rem;margin:1rem 0 0}
section{padding-block:clamp(48px,8vw,96px)}
.logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none}:root:not([data-theme="light"]) .logo-d{display:block}}
:root[data-theme="dark"] .logo-l{display:none}:root[data-theme="dark"] .logo-d{display:block}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;height:60px}
header.top .brand img{height:28px;width:auto}
header.top nav{display:flex;gap:22px;margin-inline-start:auto;font-size:.82rem}
header.top nav a{text-decoration:none;color:var(--muted);white-space:nowrap}
header.top nav a:hover{color:var(--ink)}
.lang{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-size:.8rem;font-weight:500;white-space:nowrap}
.lang:hover{border-color:var(--accent)}
@media (max-width:900px){header.top nav{display:none}header.top .lang{margin-inline-start:auto}}

/* hero */
.hero{position:relative;background:var(--band);color:var(--band-ink);overflow:hidden}
.hero img.bg{width:100%;height:min(62vw,560px);min-height:320px;object-fit:cover;opacity:.92}
.hero .panel{position:relative;background:var(--band);padding:28px 0 40px}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:end}
.hero h1{font-size:clamp(2.4rem,6vw,4.2rem);letter-spacing:-.01em}
.hero p{color:var(--band-muted);margin:.8rem 0 0;max-width:46ch}
.hero .tag{font-size:.72rem;letter-spacing:.28em;color:var(--band-muted);margin-bottom:.9rem;font-weight:500}
html[dir=rtl] .hero .tag{letter-spacing:0;font-size:.85rem}
.btn{display:inline-flex;align-items:center;gap:.6rem;border:1px solid currentColor;background:transparent;border-radius:2px;padding:.7rem 1.3rem;font-size:.9rem;font-weight:500;text-decoration:none;line-height:1.2}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hero .btn{color:var(--band-ink)}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.hero .logo-w{height:34px;width:auto;margin-bottom:18px}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr}.hero .ctas{justify-content:flex-start}}

/* facts */
.facts{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);margin-top:2.5rem}
.fact{padding:1.4rem 1rem 1.2rem 0;border-inline-end:1px solid var(--line);padding-inline-start:1rem}
.fact:first-child{padding-inline-start:0}.fact:last-child{border-inline-end:0}
.fact b{display:block;font-size:clamp(1.6rem,3vw,2.3rem);font-weight:300;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.fact span{display:block;font-size:.78rem;color:var(--muted);margin-top:.4rem;line-height:1.35}
@media (max-width:900px){.facts{grid-template-columns:repeat(3,1fr)}.fact{border-top:1px solid var(--line);margin-top:-1px}.fact:nth-child(3n){border-inline-end:0}.fact:nth-child(3n+1){padding-inline-start:0}}
@media (max-width:520px){.facts{grid-template-columns:repeat(2,1fr)}.fact:nth-child(3n){border-inline-end:1px solid var(--line)}.fact:nth-child(2n){border-inline-end:0}.fact:nth-child(2n+1){padding-inline-start:0}.fact:nth-child(3n+1):not(:nth-child(2n+1)){padding-inline-start:1rem}}

/* filter */
.filters{display:grid;gap:14px;margin-top:2rem;padding:18px;background:var(--surface);border:1px solid var(--line)}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.frow>label,.frow>.fl{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);min-width:92px;font-weight:500}
html[dir=rtl] .frow>.fl{letter-spacing:0;font-size:.82rem}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.42rem .95rem;font-size:.85rem;line-height:1.2;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select{font:inherit;font-size:.85rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:.45rem .7rem}
.fmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:1rem;font-size:.85rem;color:var(--muted)}
.fmeta button{background:none;border:0;text-decoration:underline;padding:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:1rem}
.card{background:var(--surface);border:1px solid var(--line);text-align:start;padding:0;display:flex;flex-direction:column;overflow:hidden;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .im{background:#fff;height:210px;padding:10px;border-bottom:1px solid var(--line)}
.card .im img{height:100%;width:100%;object-fit:contain;mix-blend-mode:multiply}
.card .bd{padding:14px 16px 16px;display:grid;gap:6px}
.card .row1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .code{font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums;direction:ltr}
.card .tb{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;color:var(--muted)}
.card .dot{width:9px;height:9px;border-radius:50%;background:var(--t2);display:inline-block}
.card .dot.t1{background:var(--t1)}.card .dot.t3{background:var(--t3)}
.card .meta{font-size:.84rem;color:var(--muted)}
.card .price{font-size:1.15rem;font-weight:500;font-variant-numeric:tabular-nums;margin-top:4px}
.card .price small{font-size:.72rem;color:var(--muted);font-weight:400;margin-inline-end:6px}
.card .gt{font-size:.74rem;color:var(--accent);font-weight:500}
.empty{padding:40px 0;color:var(--muted)}

/* band sections */
.band{background:var(--band);color:var(--band-ink)}
.band .eyebrow{color:var(--band-muted)}
.band .lead{color:var(--band-muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:1.8rem}
.band .chip{background:transparent;border-color:#3b3b38;color:var(--band-ink)}
.band .chip[aria-pressed=true]{background:var(--band-ink);color:#1A1A1A;border-color:var(--band-ink)}
.plan{margin-top:1.4rem;background:#fff;border:1px solid var(--line);padding:0;width:100%;cursor:zoom-in}
.plan img{width:100%;height:auto}
.lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:1.6rem}
.lvgrid h4{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--band-muted);padding-bottom:.6rem;border-bottom:1px solid #3b3b38;margin-bottom:.8rem}
html[dir=rtl] .lvgrid h4{letter-spacing:0;font-size:.9rem}
.lvgrid .chips{display:flex;flex-wrap:wrap;gap:8px}
.ucode{border:1px solid #3b3b38;background:transparent;color:var(--band-ink);border-radius:2px;padding:.45rem .7rem;font-size:.8rem;display:inline-flex;gap:8px;align-items:center;direction:ltr}
.ucode:hover{border-color:var(--band-ink)}
.ucode i{width:8px;height:8px;border-radius:50%;display:inline-block;background:#B0B0B0}
.ucode i.t2{background:#8d9276}.ucode i.t3{background:#F4F4F2}
.ucode span{color:var(--band-muted)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.8rem;color:var(--band-muted);margin-top:1rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
@media (max-width:760px){.lvgrid{grid-template-columns:1fr}}

/* amenities */
.am{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:2rem;border-top:1px solid var(--line)}
.am div{padding:1.4rem 1.2rem 1.4rem 0;border-bottom:1px solid var(--line)}
html[dir=rtl] .am div{padding:1.4rem 0 1.4rem 1.2rem}
.am h4{font-size:1.05rem;font-weight:500;margin-bottom:.35rem}
.am p{margin:0;color:var(--muted);font-size:.92rem}
.am svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;margin-bottom:.7rem}
@media (max-width:760px){.am{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.am{grid-template-columns:1fr}}
.green{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--band);color:var(--band-ink);padding:26px 30px;margin-top:2rem}
.green big{font-size:clamp(2.4rem,6vw,3.6rem);font-weight:300;line-height:1;white-space:nowrap}
.green p{margin:0;color:var(--band-muted);max-width:62ch;font-size:.95rem}
.green .bar{height:6px;background:#333;margin-top:12px;max-width:340px}.green .bar i{display:block;height:100%;background:#A3A98C}
@media (max-width:560px){.green{grid-template-columns:1fr;gap:10px}}

/* gallery */
.gal{columns:3 260px;column-gap:14px;margin-top:2rem}
.gal button{display:block;width:100%;aspect-ratio:3/2;border:0;padding:0;margin:0 0 14px;background:var(--surface);break-inside:avoid;cursor:zoom-in;position:relative;overflow:hidden}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.gal button:hover img{transform:scale(1.03)}
.note{font-size:.78rem;color:var(--muted);margin-top:1rem}

/* location */
.loc{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);align-items:start;margin-top:2rem}
.mapbox{position:relative;border:1px solid var(--line);background:#e8e8e4;direction:ltr}
.mapbox img{width:100%;height:auto;image-rendering:auto}
.mapbox .pin{position:absolute;left:50%;top:49.8%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--ink);border:3px solid #fff;box-shadow:0 0 0 7px rgba(26,26,26,.18)}
.mapbox .pl{position:absolute;left:50%;top:49.8%;transform:translate(-50%,-34px);background:#1A1A1A;color:#fff;font-size:.62rem;letter-spacing:.16em;padding:3px 8px;white-space:nowrap;font-weight:600}
.mapbox .at{position:absolute;right:6px;bottom:4px;font-size:.62rem;color:#555;background:rgba(255,255,255,.8);padding:0 4px}
.coord{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:.88rem;color:var(--muted)}
.band .coord{color:var(--band-muted)}.band .coord b{color:var(--band-ink)}
.coord b{color:var(--ink);font-weight:500;direction:ltr;white-space:nowrap}
.drive{display:grid;gap:14px;margin-top:1rem}
.drive .r{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.95rem}
.drive .r b{font-weight:500;font-variant-numeric:tabular-nums}
.drive .r .tr{grid-column:1/-1;height:4px;background:var(--chip)}
.drive .r .tr i{display:block;height:100%;background:var(--accent)}
@media (max-width:860px){.loc{grid-template-columns:1fr}}

/* payment */
.pay3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:2rem}
.pcard{background:var(--surface);border:1px solid var(--line);padding:22px}
.pcard .bn{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:500}
html[dir=rtl] .pcard .bn{letter-spacing:0;font-size:.85rem}
.pcard .mm{font-size:3rem;font-weight:300;line-height:1.1;margin-top:.4rem;font-variant-numeric:tabular-nums}
.pcard .ml{font-size:.85rem;color:var(--muted)}
.pcard .dl{margin-top:1rem;padding-top:.8rem;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.pcard .dl b{display:block;color:var(--ink);font-size:1.05rem;font-weight:500;margin-top:2px}
.pcard .fr{margin-top:.9rem;font-size:.82rem;display:grid;gap:4px}
.pcard .fr div{display:flex;justify-content:space-between;gap:8px}
.pcard .fr b{font-weight:500;font-variant-numeric:tabular-nums}
.seg{display:flex;height:46px;margin-top:1.4rem;font-size:.82rem;color:#fff}
.seg div{display:flex;align-items:center;gap:8px;padding:0 12px;white-space:nowrap;overflow:hidden}
.seg b{font-weight:500}
.seg .s1{background:#1A1A1A;border:1px solid #3a3a38}.seg .s2{background:var(--accent);color:var(--accent-ink)}.seg .s3{background:#B0B0B0;color:#1A1A1A;padding:0 6px}
.calc{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:28px;margin-top:2.2rem;padding:24px;background:var(--surface);border:1px solid var(--line)}
.calc label{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px;font-weight:500}
html[dir=rtl] .calc label{letter-spacing:0;font-size:.85rem}
.calc select{width:100%}
.calc .out{display:grid;gap:10px;font-variant-numeric:tabular-nums}
.calc .ln{display:flex;justify-content:space-between;gap:12px;padding:.5rem 0;border-bottom:1px solid var(--line);font-size:.95rem}
.calc .ln small{display:block;color:var(--muted);font-size:.76rem}
.calc .ln b{font-weight:500;white-space:nowrap}
.calc .tot{font-size:1.2rem}
.valid{margin-top:1.6rem;padding:14px 18px;background:var(--accent);color:var(--accent-ink);font-size:.92rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stor{margin-top:2rem;overflow-x:auto}
.stor table{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums;min-width:520px}
.stor th,.stor td{padding:.55rem .6rem;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.stor th{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
@media (max-width:860px){.pay3{grid-template-columns:1fr}.calc{grid-template-columns:1fr}}

/* specs */
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:1rem 0;font-size:1.05rem;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--accent);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"–"}
details ul{margin:0 0 1.2rem;padding:0;list-style:none;display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem 36px}
details li{font-size:.92rem;color:var(--muted);padding-inline-start:14px;position:relative}
details li::before{content:"";position:absolute;inset-inline-start:0;top:.72em;width:7px;height:1px;background:var(--accent)}
details li b{color:var(--ink);font-weight:500}
@media (max-width:760px){details ul{grid-template-columns:1fr}}

/* team */
.team{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:2rem}
.tp{background:var(--surface);border:1px solid var(--line);padding:26px}
.tp.dk{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.tp .lg{height:48px;width:auto;margin-bottom:16px}
.tp .role{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:500}
.tp.dk .role{color:var(--band-muted)}
html[dir=rtl] .tp .role{letter-spacing:0;font-size:.85rem}
.tp q{display:block;font-size:1.15rem;font-weight:300;margin:.6rem 0;quotes:none}
.tp p{margin:0 0 1rem;color:var(--muted);font-size:.92rem}.tp.dk p{color:var(--band-muted)}
.ths{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ths figure{margin:0}.ths img{aspect-ratio:1;object-fit:cover;width:100%}
.ths figcaption{font-size:.64rem;color:var(--muted);margin-top:3px;line-height:1.25;direction:ltr}.tp.dk .ths figcaption{color:var(--band-muted)}
@media (max-width:860px){.team{grid-template-columns:1fr}}
.name{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);margin-top:2rem}
.name h3{font-size:1.5rem}.name .k{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:500;margin-bottom:.4rem}
.name p{color:var(--muted);margin:.5rem 0 0}
@media (max-width:760px){.name{grid-template-columns:1fr}}

/* contact */
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,5vw,64px);align-items:start}
.contact h2{color:var(--band-ink)}
.crow{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;padding:.85rem 0;border-bottom:1px solid #3b3b38;font-size:.98rem}
.crow span{color:var(--band-muted);font-size:.82rem}
.crow b{font-weight:500;direction:ltr;text-align:start;overflow-wrap:anywhere}
html[dir=rtl] .crow b{text-align:end}
.cp{background:transparent;border:1px solid #3b3b38;color:var(--band-ink);border-radius:2px;padding:.3rem .75rem;font-size:.76rem}
.cp:hover{border-color:var(--band-ink)}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:1.6rem}
.band .btn{color:var(--band-ink)}.band .btn.solid{color:var(--accent-ink)}
.credits{display:flex;gap:36px;align-items:center;margin-top:2rem;flex-wrap:wrap}
.credits div{font-size:.66rem;letter-spacing:.2em;color:var(--band-muted);display:grid;gap:8px}
.credits img{height:34px;width:auto}
@media (max-width:860px){.contact{grid-template-columns:1fr}.crow{grid-template-columns:100px 1fr auto}}
footer{background:var(--band);color:var(--band-muted);padding-block:26px 40px;font-size:.76rem;border-top:1px solid #2a2a28}
footer p{margin:0 0 .5rem;max-width:90ch}
footer .tag{letter-spacing:.3em;color:var(--band-ink);font-weight:500;margin-bottom:1rem;font-size:.72rem}

/* modal */
.ov{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.72);display:none;overflow-y:auto;overscroll-behavior:contain}
.ov.on{display:block}
.md{background:var(--bg);max-width:1080px;margin:max(16px,env(safe-area-inset-top,0px)) auto 24px;position:relative;border:1px solid var(--line)}

function chip(group,val,label){return `<button class="chip" type="button" data-f="${group}" data-v="${val}" aria-pressed="${String(st[group]===val)}">${label}</button>`}
function renderFilters(){
  const ty=[['all',T('all')],...['1BR','2BR','3BR'].map(k=>[k,TYN[k][L()]])];
  const bl=[['all',T('all')],['A','A'],['B','B'],['C','C']];
  const lv=[['all',T('all')],...['OUG','GF','1F','2F'].map(k=>[k,LV[k][L()]])];
  $('#filters').innerHTML=
   `<div class="frow"><span class="fl">${T('f_type')}</span>${ty.map(x=>chip('type',x[0],x[1])).join('')}</div>
    <div class="frow"><span class="fl">${T('f_block')}</span>${bl.map(x=>chip('block',x[0],x[1])).join('')}</div>
    <div class="frow"><span class="fl">${T('f_level')}</span>${lv.map(x=>chip('lvl',x[0],x[1])).join('')}</div>
    <div class="frow"><span class="fl">${T('f_garden')}</span><button class="chip" type="button" data-f="garden" data-v="tog" aria-pressed="${st.garden}">${T('garden_only')}</button>
    <span class="fl" style="margin-inline-start:auto;min-width:0">${T('f_sort')}</span><select id="sort" aria-label="${T('f_sort')}">${[['def','s_def'],['pl','s_pl'],['ph','s_ph'],['al','s_al'],['ah','s_ah']].map(o=>`<option value="${o[0]}"${st.sort===o[0]?' selected':''}>${T(o[1])}</option>`).join('')}</select></div>`;
}
function list(){
  const lo={OUG:0,GF:1,'1F':2,'2F':3};
  let l=U.filter(u=>(st.type==='all'||u.t===st.type)&&(st.block==='all'||u.b===st.block)&&(st.lvl==='all'||u.l===st.lvl)&&(!st.garden||u.g>0));
  const s=st.sort;
  l.sort((a,b)=>s==='pl'?a.p-b.p:s==='ph'?b.p-a.p:s==='al'?a.bua-b.bua:s==='ah'?b.bua-a.bua:(a.b.localeCompare(b.b)||lo[a.l]-lo[b.l]||a.id.localeCompare(b.id)));
  return l;
}
function renderGrid(){
  const l=list();
  $('#count').textContent=l.length+' '+(l.length===1?T('n1'):T('nn'));
  $('#grid').innerHTML=l.length?l.map(u=>`<button class="card" type="button" data-u="${u.id}"><div class="im"><img src="img/u/${u.img}_3d.jpg" alt=""></div><div class="bd"><div class="row1"><span class="code">${u.id}</span><span class="tb"><i class="dot t${u.t[0]}"></i>${TYN[u.t][L()]}</span></div><div class="meta">${T('block')} ${u.b} · ${LV[u.l][L()]} · ${u.bua} ${T('sqm')}</div>${u.g?`<div class="gt">${T('garden')} ${u.g} ${T('sqm')}</div>`:''}<div class="price"><small>${T('from')}</small>${usd(u.p)}</div></div></button>`).join(''):`<div class="empty">${T('none')}</div>`;
}
function renderLevels(){

  $('#legend').innerHTML=`<span style="flex-basis:100%;margin:0 0 4px">${T('lvd')[st.level]}</span>`+['1BR','2BR','3BR'].map(k=>`<span><i style="background:${k==='1BR'?'#B0B0B0':k==='2BR'?'#8d9276':'#F4F4F2'}"></i>${TY[k][L()]}</span>`).join('');
}
function sched(u){const n=u.n;return {n,m:u.m}}
function renderCalc(){
  const u=byId[$('#csel').value]||U[0];
  $('#cout').innerHTML=`<div class="ln"><span>${T('c_price')}<small>${u.id} · ${TY[u.t][L()]} · ${u.bua} ${T('sqm')}</small></span><b>${usd(u.p)}</b></div>
  <div class="ln"><span>${T('c_down')}</span><b>${usd(u.d)}</b></div>
  <div class="ln"><span>${T('c_inst')}<small>${u.n} ${T('c_x')} ${usd(u.m)}</small></span><b>${usd(u.p*0.75)}</b></div>
  <div class="ln"><span>${T('c_last')}<small>${T('c_at')} · ${dd(u.b)}</small></span><b>${usd(u.f)}</b></div>
  <div class="pbar" aria-hidden="true"><i></i><i></i><i></i></div>`;
}
function featList(u){
  const out=u.feat.map(k=>DATA.feat[k][L()]);
  if(u.bal)out.push(u.bal===1?T('bal1'):(lang==='ar'?`${u.bal} ${T('balN')}`:`${u.bal} balconies`));
  return out;
}
function renderModal(){
  const u=byId[st.cur];if(!u)return;
  const same=U.filter(x=>x.img===u.img&&x.id!==u.id);
  const ls=list(),ix=ls.findIndex(x=>x.id===u.id);
  const src=`img/u/${u.img}_${st.view}.jpg`;
  $('#md').innerHTML=`<button class="x" type="button" id="mx" aria-label="${T('close')}">×</button>
  <div class="nv"><button type="button" id="mp" aria-label="${T('prev')}">${lang==='ar'?'›':'‹'}</button><button type="button" id="mn" aria-label="${T('next')}">${lang==='ar'?'‹':'›'}</button></div>
  <div class="mg"><div class="mimg"><div class="tabs"><button class="chip" type="button" data-view="3d" aria-pressed="${st.view==='3d'}">${T('d3')}</button><button class="chip" type="button" data-view="2d" aria-pressed="${st.view==='2d'}">${T('d2')}</button></div><button class="vw" type="button" data-lb="${src}" aria-label="Zoom"><img src="${src}" alt="${u.id}"></button></div>
  <div class="mtx"><div class="bk"><img src="img/bk_${u.b}.png" alt="${T('block')} ${u.b}"><div><div class="eyebrow">${T('block')} ${u.b} · ${LV[u.l][L()]}</div><h3>${u.id}</h3></div></div>
  <div class="sub">${TY[u.t][L()]}</div>
  <div class="kv"><div class="pr"><span>${T('price')}</span><b>${usd(u.p)}</b></div><div><span>${T('bua')}</span><b>${u.bua} ${T('sqm')}</b></div>${u.g?`<div><span>${T('gard')}</span><b>${u.g} ${T('sqm')}</b></div>`:''}</div>
  <div><div class="eyebrow" style="margin-bottom:8px">${T('pstruct')}</div><div class="pbar"><i></i><i></i><i></i></div>
  <div class="kv" style="margin-top:6px"><div><span>${T('down')} · 20%</span><b>${usd(u.d)}</b></div><div><span>${T('monthly')} · ${u.n} ${T('inst')}</span><b>${usd(u.m)}</b></div><div><span>${T('finalp')} · 5%</span><b>${usd(u.f)}</b></div><div><span>${T('deliv')}</span><b>${dd(u.b)}</b></div></div></div>
  <div class="chips2">${featList(u).map(f=>`<span>${f}</span>`).join('')}</div>
  ${same.length?`<div class="same">${T('same')}: ${same.map(x=>`<button type="button" data-u="${x.id}">${x.id}</button>`).join('')}</div>`:''}
  <div class="small">${T('valid_s')}. ${DATA.disc[L()]}</div>
  <div class="cta-row" style="margin:0"><a class="btn solid" href="https://wa.me/96170032800" target="_blank" rel="noopener" style="color:var(--accent-ink)">${T('wa')}</a><a class="btn" href="#contact" data-go="contact" data-close="1">${T('enq')}</a></div>
  </div></div>`;
  $('#mp').disabled=$('#mn').disabled=ls.length<2||ix<0;
}
function openU(id,push){st.cur=id;st.view='3d';renderModal();$('#ov').classList.add('on');document.body.style.overflow='hidden';$('#ov').scrollTop=0;if(push!==false)try{history.replaceState(null,'','#'+id)}catch(e){location.hash=id}}
function closeU(){$('#ov').classList.remove('on');document.body.style.overflow='';st.cur=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
function step(d){const ls=list(),ix=ls.findIndex(x=>x.id===st.cur);if(ix<0||ls.length<2)return;const n=ls[(ix+d+ls.length)%ls.length];openU(n.id);}
function lb(src,dark){const e=$('#lb');e.querySelector('img').src=src;e.classList.add('on')}
function goto(id){if(id==='top'){window.scrollTo({top:0,behavior:'smooth'});return}const e=document.getElementById(id);if(e){const y=e.getBoundingClientRect().top+scrollY-64;window.scrollTo({top:y,behavior:'smooth'})}}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-f],[data-u],[data-lvl],[data-view],[data-lb],[data-go],[data-copy],#lang,#reset,#mx,#mp,#mn,#ov,#lb');if(!t)return;
  if(t.id==='lb'){t.classList.remove('on');return}
  if(t.dataset.lb){lb(t.dataset.lb);return}
  if(t.id==='ov'&&e.target===t){closeU();return}
  if(t.id==='mx'){closeU();return}
  if(t.id==='mp'){step(-1);return}if(t.id==='mn'){step(1);return}
  if(t.dataset.go){e.preventDefault();if(t.dataset.close)closeU();goto(t.dataset.go);return}
  if(t.dataset.u){openU(t.dataset.u);return}
  if(t.dataset.view){st.view=t.dataset.view;renderModal();return}
  if(t.dataset.lvl){st.level=t.dataset.lvl;renderLevels();return}
  if(t.dataset.f){const g=t.dataset.f;if(g==='garden')st.garden=!st.garden;else st[g]=t.dataset.v;renderFilters();renderGrid();return}
  if(t.id==='reset'){st.type=st.block=st.lvl='all';st.garden=false;st.sort='def';renderFilters();renderGrid();return}
  if(t.id==='lang'){lang=lang==='en'?'ar':'en';try{localStorage.setItem(LANGKEY,lang)}catch(_){}applyStatic();return}
  if(t.dataset.copy){const v=t.dataset.copy;const done=()=>toast(T('copied'));(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(v).then(done):Promise.reject()).catch(()=>toast(T('nocopy')));return}
});
document.addEventListener('change',e=>{if(e.target.id==='sort'){st.sort=e.target.value;renderGrid()}if(e.target.id==='csel')renderCalc()});
$('#lvplan').addEventListener('click',()=>lb($('#lvimg').src));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#lb').classList.contains('on'))$('#lb').classList.remove('on');else if(st.cur)closeU()}
  if(st.cur&&!$('#lb').classList.contains('on')){if(e.key==='ArrowRight')step(lang==='ar'?-1:1);if(e.key==='ArrowLeft')step(lang==='ar'?1:-1)}
});
function route(){const h=decodeURIComponent((location.hash||'').slice(1));if(byId[h])openU(h,false);else if(st.cur&&!h)closeU();else if(h&&document.getElementById(h)&&!byId[h])goto(h)}
window.addEventListener('hashchange',route);
applyStatic();route();
</script>
